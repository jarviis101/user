syntax = "proto3";

package user;

option go_package = "./userpb";

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
}

message CreateUserResponse {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}
